# Unit tests only. evals/ calls a live model via scripts/run-evals.sh
# and is intentionally not run here.

name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: gofmt, vet, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - name: vet
        run: go vet ./...
      - name: test
        run: go test ./...
