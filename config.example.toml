# Sigma configuration.
# Copy to ~/.config/sigma/config.toml, or to .sigma.toml in a workspace.
# SIGMA_BASE_URL, SIGMA_MODEL, and SIGMA_API_KEY override the file.
# CLI flags override the environment. There is no default model or base URL.

# openai uses base_url. chatgpt uses `sigma login chatgpt` and does not need
# an API key. claude, gemini, and grok need allow_subscription_risk or a
# [subscription] flag before login. Their request adapters follow this one.
provider = "openai"
base_url = "https://api.openai.com/v1"
model = "gpt-4o-mini"
api_key = "sk-replace-me"

# models = ["gpt-4o-mini", "gpt-4o"]
# allow_subscription_risk = false
# [subscription]
# claude = false
# gemini = false
# grok = false

# plan (read-only) | ask (prompt before writes) | auto (run what the rules allow)
approval_mode = "ask"
max_steps = 50
bash_timeout_seconds = 120

# 0 disables. Otherwise this is an estimated token count (about 4 characters
# each). Above it, older turns are summarized and the recent ones are kept.
compact_threshold = 80000

# local runs bash on this machine. docker runs it in a container. The image
# must provide bash. Approval rules are the same either way.
sandbox = "local"
# docker_image = "golang:1.22"

# explore_max_steps = 8
# explore_max_tokens = 8000

# MCP servers. command is a stdio server. url is streamable HTTP.
# Tools are exposed as mcp__<name>__<tool> and follow the approval rules.
# [[mcp]]
# name = "echo"
# command = ["python", "echo_server.py"]

# [[mcp]]
# name = "remote"
# url = "http://127.0.0.1:8080/mcp"

# Commands run after a successful edit_file or write_file. A non-zero exit
# is shown to the model so it can fix the failure. Leave this unset to skip.
# verify = ["go vet ./...", "go test ./..."]

# Rules match on "tool" or "tool:argument".
# * is a glob that matches any text, including slashes and spaces.
# Matching does not follow the order of this list. Every matching deny
# wins over every ask, and every ask wins over every allow.
# Patterns are anchored: bash:rm -rf * matches "rm -rf /tmp" but not "echo rm -rf".

[[rules]]
action = "deny"
pattern = "bash:rm -rf *"

[[rules]]
action = "ask"
pattern = "bash:git push*"

[[rules]]
action = "allow"
pattern = "bash:go test*"
